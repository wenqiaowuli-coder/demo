<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动量守恒定律 - 两球碰撞演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .main-area {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .canvas-wrap {
            flex: 1;
            min-width: 600px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        canvas {
            display: block;
            width: 100%;
            border-radius: 8px;
            background: #0a0a1a;
        }
        .panel {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .card {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .card h3 {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.88rem;
        }
        .row label { color: #bbb; }
        .row input[type=range] {
            width: 140px;
            accent-color: #3a7bd5;
        }
        .row .val {
            min-width: 42px;
            text-align: right;
            font-family: monospace;
            color: #00d2ff;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .info-item {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .info-item .label {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 4px;
        }
        .info-item .value {
            font-size: 1.1rem;
            font-family: monospace;
            font-weight: bold;
        }
        .info-item.ball-a .value { color: #ff6b6b; }
        .info-item.ball-b .value { color: #4ecdc4; }
        .info-item.total .value { color: #ffd93d; }
        .info-item.energy .value { color: #a78bfa; }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        button {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { transform: translateY(-1px); }
        .btn-start { background: linear-gradient(135deg, #00b09b, #96c93d); color: #fff; }
        .btn-pause { background: linear-gradient(135deg, #f7971e, #ffd200); color: #333; }
        .btn-reset { background: linear-gradient(135deg, #e44d26, #ff416c); color: #fff; }
        .formula {
            text-align: center;
            padding: 14px;
            font-size: 1.1rem;
            color: #ffd93d;
            background: rgba(255,217,61,0.08);
            border-radius: 8px;
            font-family: 'Times New Roman', serif;
            letter-spacing: 1px;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 10px;
            font-size: 0.82rem;
            color: #999;
        }
        .legend span::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }
        .legend .la::before { background: #ff6b6b; }
        .legend .lb::before { background: #4ecdc4; }
        .legend .lt::before { background: #ffd93d; }
        .collision-type {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .collision-type label {
            flex: 1;
            text-align: center;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }
        .collision-type input { display: none; }
        .collision-type input:checked + span {
            color: #00d2ff;
            font-weight: bold;
        }
        .collision-type label:has(input:checked) {
            border-color: #00d2ff;
            background: rgba(0,210,255,0.1);
        }
        @media (max-width: 900px) {
            .main-area { flex-direction: column; }
            .canvas-wrap { min-width: unset; }
            .panel { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>动量守恒定律 — 两球碰撞演示</h1>
    <p class="subtitle">调节质量与速度，观察完全弹性碰撞与完全非弹性碰撞的动量守恒过程</p>

    <div class="formula">
        p₁v₁ + p₂v₂ = p₁v₁' + p₂v₂' &nbsp;|&nbsp; 动量守恒
    </div>

    <div class="main-area" style="margin-top:16px;">
        <div class="canvas-wrap">
            <canvas id="cvs" width="800" height="500"></canvas>
            <div class="legend">
                <span class="la">小球 A</span>
                <span class="lb">小球 B</span>
                <span class="lt">总动量</span>
            </div>
        </div>
        <div class="panel">
            <div class="card">
                <h3>碰撞类型</h3>
                <div class="collision-type">
                    <label><input type="radio" name="ctype" value="elastic" checked><span>完全弹性</span></label>
                    <label><input type="radio" name="ctype" value="inelastic"><span>完全非弹性</span></label>
                </div>
            </div>
            <div class="card">
                <h3>参数调节</h3>
                <div class="row">
                    <label>球 A 质量</label>
                    <input type="range" id="mA" min="1" max="20" value="5" step="0.5">
                    <span class="val" id="mA_v">5.0 kg</span>
                </div>
                <div class="row">
                    <label>球 A 速度</label>
                    <input type="range" id="vA" min="-5" max="5" value="3" step="0.1">
                    <span class="val" id="vA_v">3.0 m/s</span>
                </div>
                <div class="row">
                    <label>球 B 质量</label>
                    <input type="range" id="mB" min="1" max="20" value="3" step="0.5">
                    <span class="val" id="mB_v">3.0 kg</span>
                </div>
                <div class="row">
                    <label>球 B 速度</label>
                    <input type="range" id="vB" min="-5" max="5" value="-2" step="0.1">
                    <span class="val" id="vB_v">-2.0 m/s</span>
                </div>
            </div>
            <div class="card">
                <h3>实时数据</h3>
                <div class="info-grid">
                    <div class="info-item ball-a">
                        <div class="label">球 A 动量</div>
                        <div class="value" id="pA">15.0</div>
                    </div>
                    <div class="info-item ball-b">
                        <div class="label">球 B 动量</div>
                        <div class="value" id="pB">-6.0</div>
                    </div>
                    <div class="info-item total">
                        <div class="label">总动量</div>
                        <div class="value" id="pTotal">9.0</div>
                    </div>
                    <div class="info-item energy">
                        <div class="label">总动能</div>
                        <div class="value" id="eTotal">31.5</div>
                    </div>
                </div>
            </div>
            <div class="card">
                <h3>碰撞前后对比</h3>
                <div class="info-grid">
                    <div class="info-item ball-a">
                        <div class="label">碰撞前 总动量</div>
                        <div class="value" id="pBefore">9.0</div>
                    </div>
                    <div class="info-item ball-b">
                        <div class="label">碰撞后 总动量</div>
                        <div class="value" id="pAfter">—</div>
                    </div>
                    <div class="info-item energy">
                        <div class="label">碰撞前 动能</div>
                        <div class="value" id="eBefore">31.5</div>
                    </div>
                    <div class="info-item total">
                        <div class="label">碰撞后 动能</div>
                        <div class="value" id="eAfter">—</div>
                    </div>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn-start" id="btnStart">▶ 开始</button>
                <button class="btn-pause" id="btnPause">⏸ 暂停</button>
                <button class="btn-reset" id="btnReset">↺ 重置</button>
            </div>
        </div>
    </div>
</div>

<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
const W = cvs.width, H = cvs.height;
const GROUND = H - 60;

const els = {
    mA: document.getElementById('mA'),
    mB: document.getElementById('mB'),
    vA: document.getElementById('vA'),
    vB: document.getElementById('vB'),
    mA_v: document.getElementById('mA_v'),
    mB_v: document.getElementById('mB_v'),
    vA_v: document.getElementById('vA_v'),
    vB_v: document.getElementById('vB_v'),
};

let ballA, ballB, running = false, animId = null, collided = false;

function getParams() {
    const mA = parseFloat(els.mA.value);
    const mB = parseFloat(els.mB.value);
    const vA = parseFloat(els.vA.value);
    const vB = parseFloat(els.vB.value);
    return { mA, mB, vA, vB };
}

function getCollisionType() {
    return document.querySelector('input[name=ctype]:checked').value;
}

function radiusFromMass(m) {
    return 16 + Math.sqrt(m) * 8;
}

function createBalls() {
    const p = getParams();
    const rA = radiusFromMass(p.mA);
    const rB = radiusFromMass(p.mB);
    ballA = {
        x: W * 0.3, y: GROUND - rA,
        vx: p.vA * 60, vy: 0,
        r: rA, m: p.mA,
        color: '#ff6b6b', trail: []
    };
    ballB = {
        x: W * 0.7, y: GROUND - rB,
        vx: p.vB * 60, vy: 0,
        r: rB, m: p.mB,
        color: '#4ecdc4', trail: []
    };
    collided = false;
    updateDisplay(p);
}

function updateDisplay(p) {
    if (!p) p = getParams();
    els.mA_v.textContent = p.mA.toFixed(1) + ' kg';
    els.mB_v.textContent = p.mB.toFixed(1) + ' kg';
    els.vA_v.textContent = p.vA.toFixed(1) + ' m/s';
    els.vB_v.textContent = p.vB.toFixed(1) + ' m/s';

    const pA = p.mA * p.vA;
    const pB = p.mB * p.vB;
    const pT = pA + pB;
    const eT = 0.5 * p.mA * p.vA * p.vA + 0.5 * p.mB * p.vB * p.vB;

    document.getElementById('pA').textContent = pA.toFixed(1);
    document.getElementById('pB').textContent = pB.toFixed(1);
    document.getElementById('pTotal').textContent = pT.toFixed(1);
    document.getElementById('eTotal').textContent = eT.toFixed(1);
    document.getElementById('pBefore').textContent = pT.toFixed(1);
    document.getElementById('eBefore').textContent = eT.toFixed(1);

    if (collided && ballA && ballB) {
        const vA2 = ballA.vx / 60;
        const vB2 = ballB.vx / 60;
        const pA2 = ballA.m * vA2;
        const pB2 = ballB.m * vB2;
        const pT2 = pA2 + pB2;
        const eT2 = 0.5 * ballA.m * vA2 * vA2 + 0.5 * ballB.m * vB2 * vB2;
        document.getElementById('pAfter').textContent = pT2.toFixed(1);
        document.getElementById('eAfter').textContent = eT2.toFixed(1);
    }
}

function drawGround() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    ctx.lineTo(W, GROUND);
    ctx.stroke();
    // 标尺
    ctx.fillStyle = '#555';
    ctx.font = '11px monospace';
    for (let i = 0; i <= W; i += 100) {
        ctx.fillText(i / 60 * 1 + 'm', i, GROUND + 16);
        ctx.fillRect(i, GROUND - 4, 1, 8);
    }
}

function drawBall(b, label) {
    // 轨迹
    ctx.globalAlpha = 0.15;
    for (let i = 0; i < b.trail.length; i++) {
        const t = b.trail[i];
        ctx.beginPath();
        ctx.arc(t.x, t.y, b.r * (i / b.trail.length) * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 球体
    const grad = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(0.3, b.color);
    grad.addColorStop(1, shadeColor(b.color, -40));
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 标签
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, b.x, b.y);
    ctx.font = '11px monospace';
    ctx.fillText(b.m.toFixed(1) + 'kg', b.x, b.y + 16);

    // 速度箭头
    if (Math.abs(b.vx) > 1) {
        const arrowLen = b.vx * 0.8;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y - b.r - 10);
        ctx.lineTo(b.x + arrowLen, b.y - b.r - 10);
        ctx.strokeStyle = '#ffd93d';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        // 箭头
        const dir = arrowLen > 0 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(b.x + arrowLen, b.y - b.r - 10);
        ctx.lineTo(b.x + arrowLen - dir * 8, b.y - b.r - 16);
        ctx.lineTo(b.x + arrowLen - dir * 8, b.y - b.r - 4);
        ctx.closePath();
        ctx.fillStyle = '#ffd93d';
        ctx.fill();
        ctx.fillStyle = '#ffd93d';
        ctx.font = '11px monospace';
        ctx.fillText((b.vx / 60).toFixed(1) + ' m/s', b.x + arrowLen / 2, b.y - b.r - 22);
    }
}

function shadeColor(color, percent) {
    let R = parseInt(color.substring(1,3),16);
    let G = parseInt(color.substring(3,5),16);
    let B = parseInt(color.substring(5,7),16);
    R = Math.min(255, Math.max(0, R + percent));
    G = Math.min(255, Math.max(0, G + percent));
    B = Math.min(255, Math.max(0, B + percent));
    return '#' + (R<16?'0':'') + R.toString(16) + (G<16?'0':'') + G.toString(16) + (B<16?'0':'') + B.toString(16);
}

function drawMomentumBar() {
    const mA = ballA.m, mB = ballB.m;
    const vA = ballA.vx / 60, vB = ballB.vx / 60;
    const pA = mA * vA, pB = mB * vB;
    const maxP = 60;
    const barH = 16;
    const barW = 180;
    const bx = W / 2 - barW / 2;
    const by = 30;

    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';

    // 球A动量
    ctx.fillStyle = '#ff6b6b';
    ctx.fillText('A:', bx - 22, by + 11);
    const wA = (pA / maxP) * barW;
    ctx.fillStyle = 'rgba(255,107,107,0.6)';
    ctx.fillRect(bx, by, Math.abs(wA), barH);
    ctx.fillStyle = '#ff6b6b';
    ctx.fillText(pA.toFixed(1), bx + barW + 6, by + 12);

    // 球B动量
    ctx.fillStyle = '#4ecdc4';
    ctx.fillText('B:', bx - 22, by + 34);
    const wB = (pB / maxP) * barW;
    ctx.fillStyle = 'rgba(78,205,196,0.6)';
    ctx.fillRect(bx, by + 23, Math.abs(wB), barH);
    ctx.fillStyle = '#4ecdc4';
    ctx.fillText(pB.toFixed(1), bx + barW + 6, by + 35);

    // 总动量
    ctx.fillStyle = '#ffd93d';
    ctx.fillText('Σp:', bx - 30, by + 56);
    const wT = ((pA + pB) / maxP) * barW;
    ctx.fillStyle = 'rgba(255,217,61,0.6)';
    ctx.fillRect(bx, by + 46, Math.abs(wT), barH);
    ctx.fillStyle = '#ffd93d';
    ctx.fillText((pA + pB).toFixed(1), bx + barW + 6, by + 57);
}

function drawStatus() {
    ctx.fillStyle = collided ? 'rgba(0,180,155,0.3)' : 'rgba(255,255,255,0.05)';
    ctx.fillRect(W / 2 - 50, H - 45, 100, 28);
    ctx.fillStyle = collided ? '#00b09b' : '#888';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(collided ? '已碰撞 ✓' : '等待碰撞...', W / 2, H - 27);
}

function physics(dt) {
    if (!running) return;
    ballA.x += ballA.vx * dt;
    ballB.x += ballB.vx * dt;

    // 墙壁反弹
    if (ballA.x - ballA.r < 0) { ballA.x = ballA.r; ballA.vx = Math.abs(ballA.vx); }
    if (ballA.x + ballA.r > W) { ballA.x = W - ballA.r; ballA.vx = -Math.abs(ballA.vx); }
    if (ballB.x - ballB.r < 0) { ballB.x = ballB.r; ballB.vx = Math.abs(ballB.vx); }
    if (ballB.x + ballB.r > W) { ballB.x = W - ballB.r; ballB.vx = -Math.abs(ballB.vx); }

    // 碰撞检测
    if (!collided) {
        const dx = ballB.x - ballA.x;
        const dist = Math.abs(dx);
        if (dist < ballA.r + ballB.r) {
            collided = true;
            const type = getCollisionType();
            if (type === 'elastic') {
                const v1 = ballA.vx, v2 = ballB.vx;
                const m1 = ballA.m, m2 = ballB.m;
                ballA.vx = ((m1 - m2) * v1 + 2 * m2 * v2) / (m1 + m2);
                ballB.vx = ((m2 - m1) * v2 + 2 * m1 * v1) / (m1 + m2);
            } else {
                const v1 = ballA.vx, v2 = ballB.vx;
                const m1 = ballA.m, m2 = ballB.m;
                const vf = (m1 * v1 + m2 * v2) / (m1 + m2);
                ballA.vx = vf;
                ballB.vx = vf;
            }
            updateDisplay();
        }
    }

    // 轨迹
    ballA.trail.push({ x: ballA.x, y: ballA.y });
    ballB.trail.push({ x: ballB.x, y: ballB.y });
    if (ballA.trail.length > 30) ballA.trail.shift();
    if (ballB.trail.length > 30) ballB.trail.shift();
}

let lastTime = 0;
function render(ts) {
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    physics(dt);

    ctx.clearRect(0, 0, W, H);
    drawGround();
    drawMomentumBar();
    drawBall(ballA, 'A');
    drawBall(ballB, 'B');
    drawStatus();
    updateDisplay();

    animId = requestAnimationFrame(render);
}

function start() {
    if (!running) {
        if (!ballA) createBalls();
        running = true;
        lastTime = performance.now();
        animId = requestAnimationFrame(render);
    }
}

function pause() {
    running = false;
    if (animId) cancelAnimationFrame(animId);
}

function reset() {
    pause();
    collided = false;
    createBalls();
    document.getElementById('pAfter').textContent = '—';
    document.getElementById('eAfter').textContent = '—';
    ctx.clearRect(0, 0, W, H);
    drawGround();
    drawMomentumBar();
    drawBall(ballA, 'A');
    drawBall(ballB, 'B');
    drawStatus();
}

// 事件绑定
['mA','mB','vA','vB'].forEach(id => {
    els[id].addEventListener('input', () => {
        if (!running) {
            createBalls();
            ctx.clearRect(0, 0, W, H);
            drawGround();
            drawMomentumBar();
            drawBall(ballA, 'A');
            drawBall(ballB, 'B');
            drawStatus();
        }
    });
});

document.querySelectorAll('input[name=ctype]').forEach(r => {
    r.addEventListener('change', () => {
        if (!running) reset();
    });
});

document.getElementById('btnStart').addEventListener('click', start);
document.getElementById('btnPause').addEventListener('click', pause);
document.getElementById('btnReset').addEventListener('click', reset);

// 初始化
createBalls();
reset();
</script>
</body>
</html>
