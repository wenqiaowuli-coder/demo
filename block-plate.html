<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 
    文件描述：板块运动演示（完整版）
    物理内容：展示物块 A 在板块 B 上的相对滑动、共速、滑出及摩擦生热等完整过程
    适用场景：高中物理“板块模型”教学，可调节 B 的初速度和动摩擦因数，实时显示 v-t 图、
              相对位移、摩擦生热等数据，支持物块滑出后继续运动的情景。
    -->
    <title>板块运动演示｜高中物理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #121212;
            color: #fff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 10px;
        }
        h1 { font-size: 20px; margin-bottom: 10px; }
        canvas {
            border: 2px solid #3388dd;
            background-color: #0b1828;
            display: block;
        }
        #graphCanvas {
            margin-top: 10px;
            border: 1px solid #225566;
            background-color: #081420;
        }
        .panel {
            margin-top: 12px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 860px;
            width: 100%;
        }
        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px 14px;
            flex: 1;
            min-width: 180px;
        }
        .card-title {
            font-size: 11px;
            color: #8899aa;
            margin-bottom: 7px;
            letter-spacing: 0.4px;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 5px;
        }
        .row label {
            font-size: 12px;
            color: #ccd;
            white-space: nowrap;
            min-width: 58px;
        }
        .row input[type=range] { flex: 1; }
        .val {
            min-width: 52px;
            text-align: right;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            color: #99aabb;
        }
        .data {
            margin-top: 10px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 860px;
            width: 100%;
        }
        .data-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 12px;
            color: #aab;
            text-align: center;
            flex: 1;
            min-width: 120px;
        }
        .data-card .num {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
        }
        .actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #3388dd;
            border: none;
            color: #fff;
            padding: 7px 14px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
        }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        .status {
            margin-top: 7px;
            font-size: 12px;
            color: #99aabb;
            text-align: center;
            min-height: 16px;
        }
        .legend {
            margin-top: 8px;
            font-size: 11px;
            color: #778899;
            text-align: center;
        }
        .legend span { margin: 0 5px; }
    </style>
</head>
<body>
    <h1>板块运动演示</h1>
    <canvas id="canvas" width="860" height="420"></canvas>
    <canvas id="graphCanvas" width="860" height="180"></canvas>

    <div class="panel">
        <div class="card">
            <div class="card-title">参数设定</div>
            <div class="row">
                <label>B初速度</label>
                <input id="v0B" type="range" min="0" max="10" value="0" step="0.5">
                <div class="val" id="v0BVal">0.0 m/s</div>
            </div>
            <div class="row">
                <label>动摩擦 μ</label>
                <input id="mu" type="range" min="5" max="50" value="20" step="1">
                <div class="val" id="muVal">0.20</div>
            </div>
            <div class="row">
                <label>动画速度</label>
                <input id="ts" type="range" min="5" max="30" value="10" step="1">
                <div class="val" id="tsVal">1.0×</div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">速度显示（下方 v-t 图同步）</div>
            <div class="row">
                <label>物块 A vₐ</label>
                <div class="val" id="dVA">— m/s</div>
            </div>
            <div class="row">
                <label>板块 B vᵦ</label>
                <div class="val" id="dVB">— m/s</div>
            </div>
            <div class="row">
                <label>相对速度</label>
                <div class="val" id="dVR">— m/s</div>
            </div>
            <div class="row">
                <label>运动状态</label>
                <div class="val" id="dState">待开始</div>
            </div>
        </div>
    </div>

    <div class="data">
        <div class="data-card">共速时刻<div class="num" id="dTEnd">—</div></div>
        <div class="data-card">共速后速度<div class="num" id="dVFinal">—</div></div>
        <div class="data-card">A 相对 B 位移<div class="num" id="dRelDisp">—</div></div>
        <div class="data-card">是否滑出<div class="num" id="dSlideOff">—</div></div>
        <div class="data-card">摩擦生热<div class="num" id="dHeat">—</div></div>
    </div>

    <div class="actions">
        <button id="btnStart">开始</button>
        <button id="btnReset" disabled>重置</button>
    </div>
    <div class="status" id="status"></div>
    <div class="legend">
        <span>🟦 物块 A</span>
        <span>🟧 板块 B</span>
        <span>📈 vₐ 蓝线</span>
        <span>📈 vᵦ 橙线</span>
    </div>

    <script>
    (() => {
        // ========== DOM ==========
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const graphCanvas = document.getElementById('graphCanvas');
        const gctx = graphCanvas.getContext('2d');

        const elV0B   = document.getElementById('v0B');
        const elMu    = document.getElementById('mu');
        const elTs    = document.getElementById('ts');
        const elV0BVal = document.getElementById('v0BVal');
        const elMuVal  = document.getElementById('muVal');
        const elTsVal  = document.getElementById('tsVal');
        const elVA   = document.getElementById('dVA');
        const elVB   = document.getElementById('dVB');
        const elVR   = document.getElementById('dVR');
        const elState= document.getElementById('dState');
        const elTEnd = document.getElementById('dTEnd');
        const elVFin = document.getElementById('dVFinal');
        const elRel  = document.getElementById('dRelDisp');
        const elSlide= document.getElementById('dSlideOff');
        const elHeat = document.getElementById('dHeat');
        const elStatus = document.getElementById('status');
        const btnStart = document.getElementById('btnStart');
        const btnReset = document.getElementById('btnReset');

        const g = 9.8;
        const CW = canvas.width;
        const CH = canvas.height;
        const GW = graphCanvas.width;
        const GH = graphCanvas.height;

        // ========== 坐标映射 ==========
        const SCALE = 5;          // 1 m -> 5 px
        const PAD   = 55;
        const GROUND_Y = CH - PAD;
        const WX = x => PAD + x * SCALE;
        const WY = y => GROUND_Y - y * SCALE;

        // ========== 物理参数 ==========
        const P = {
            mA: 2, mB: 4,          // kg，用于相对位移/热量计算
            v0A: 12,               // m/s
            v0B: 0,
            mu: 0.2,
            L: 5,                  // B 长度 m
            W: 1.8,                // B 宽度 m
            BH: 0.9,               // B 高度 m（侧视图，仅装饰）
        };

        // ========== 物理计算 ==========
        function physics() {
            const mu = P.mu;
            const tTrans = Math.max(0, (P.v0A - P.v0B) / (mu * g));
            const vFinal = P.v0A - mu * g * tTrans;
            const relDisp = 0.5 * (P.v0A - P.v0B) * tTrans;
            const heat = P.mu * g * Math.min(relDisp, relDisp); // Q = f * s_rel
            return {
                tTrans,
                vFinal,
                relDisp,
                heat,
                slideOff: relDisp > P.L,
            };
        }

        // 指定时刻 t 的速度
        function velocities(t) {
            const ph = physics();
            if (t >= ph.tTrans && ph.tTrans > 0) {
                return { vA: ph.vFinal, vB: ph.vFinal, trans: true };
            }
            return {
                vA: Math.max(P.v0A - P.mu * g * t, ph.tTrans > 0 ? ph.vFinal : P.v0A),
                vB: P.v0B + P.mu * g * P.mA / P.mB * Math.min(t, ph.tTrans),
                trans: false,
            };
        }

        // ========== 状态 ==========
        let state = 'idle'; // idle | running | ended
        let simT  = 0;
        let lastTs = null;
        let timeScale = 1;
        let animId = null;
        let velHist = [];   // [{t, vA, vB}]
        let slideOffTriggered = false;

        // ========== 绘制：运动场景 ==========
        function drawScene(t, drawA, drawB) {
            ctx.clearRect(0, 0, CW, CH);

            // 网格
            ctx.strokeStyle = '#182430';
            ctx.lineWidth = 1;
            for (let mx = 0; mx <= 30; mx++) {
                const x = WX(mx);
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, CH); ctx.stroke();
            }
            for (let my = 0; my <= 10; my++) {
                const y = WY(my);
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(CW, y); ctx.stroke();
            }

            // 地面
            ctx.strokeStyle = '#3a4a5a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(CW, GROUND_Y);
            ctx.stroke();

            // 地面标注
            ctx.fillStyle = '#556677';
            ctx.font = '11px system-ui';
            ctx.textAlign = 'center';
            for (let mx = 0; mx <= 25; mx += 5) {
                ctx.fillText(mx + 'm', WX(mx), GROUND_Y + 16);
            }
            ctx.fillText('O', PAD - 12, GROUND_Y + 16);

            // 板块 B
            const bLeft  = WX(drawB.x);
            const bRight = WX(drawB.x + P.W);
            const bTop   = WY(0);
            const bBot   = GROUND_Y;

            // 阴影
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(bLeft + 3, bBot + 2, bRight - bLeft, 6);

            // 主体
            const bg = ctx.createLinearGradient(bLeft, bTop, bLeft, bBot);
            bg.addColorStop(0, '#cc7722');
            bg.addColorStop(0.6, '#aa5500');
            bg.addColorStop(1, '#773300');
            ctx.fillStyle = bg;
            ctx.fillRect(bLeft, bTop, bRight - bLeft, bBot - bTop);

            // 边框
            ctx.strokeStyle = '#ffaa44';
            ctx.lineWidth = 2;
            ctx.strokeRect(bLeft, bTop, bRight - bLeft, bBot - bTop);

            // 标签
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText('B', (bLeft + bRight) / 2, bTop + 20);
            ctx.fillStyle = '#ffcc88';
            ctx.font = '10px system-ui';
            ctx.fillText(`vᵦ=${drawB.v.toFixed(1)} m/s`, (bLeft + bRight) / 2, bTop + 34);

            // 粗糙面纹理线
            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 3; i++) {
                const ly = bTop + (bBot - bTop) * i / 4;
                ctx.beginPath();
                ctx.moveTo(bLeft + 4, ly);
                ctx.lineTo(bRight - 4, ly);
                ctx.stroke();
            }

            // 物块 A
            if (drawA.onPlate) {
                const aSize = 0.65;
                const aLeft = WX(drawA.x);
                const aTop  = WY(aSize);
                const aBot  = bTop;

                // 阴影
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(aLeft + 2, aBot + 2, aSize * SCALE, 5);

                // 主体
                const ag = ctx.createLinearGradient(aLeft, aTop, aLeft, aBot);
                ag.addColorStop(0, '#44aaff');
                ag.addColorStop(1, '#1166cc');
                ctx.fillStyle = ag;
                ctx.fillRect(aLeft, aTop, aSize * SCALE, aBot - aTop);

                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 2;
                ctx.strokeRect(aLeft, aTop, aSize * SCALE, aBot - aTop);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('A', aLeft + aSize * SCALE / 2, aTop + 20);
                ctx.fillStyle = '#aaddff';
                ctx.font = '10px system-ui';
                ctx.fillText(`vₐ=${drawA.v.toFixed(1)}`, aLeft + aSize * SCALE / 2, aTop + 33);
            } else if (drawA.fallen) {
                // 落地后
                const ax = WX(drawA.x);
                const ay = GROUND_Y - 5 * SCALE;
                ctx.fillStyle = '#3388cc';
                ctx.beginPath();
                ctx.arc(ax, ay, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#66ccff';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.fillStyle = '#aaddff';
                ctx.font = '10px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('A', ax, ay + 3);
            }

            // 摩擦箭头（A 在 B 上滑动时）
            if (drawA.onPlate && Math.abs(drawA.v - drawB.v) > 0.05) {
                const midX = (WX(drawA.x) + WX(drawA.x + 0.325)) / 2;
                const midY = bTop - 14;
                const arrowDir = drawA.v > drawB.v ? 1 : -1;
                ctx.strokeStyle = '#ffdd57';
                ctx.fillStyle = '#ffdd57';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(midX - 6 * arrowDir, midY);
                ctx.lineTo(midX + 6 * arrowDir, midY);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(midX + 6 * arrowDir, midY);
                ctx.lineTo(midX + 2 * arrowDir, midY - 4);
                ctx.lineTo(midX + 2 * arrowDir, midY + 4);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#ffdd57';
                ctx.font = '10px system-ui';
                ctx.fillText('f', midX, midY - 5);
            }
        }

        // ========== 绘制：v-t 图 ==========
        function drawGraph() {
            gctx.clearRect(0, 0, GW, GH);

            const padL = 50, padR = 18, padT = 16, padB = 32;
            const plotW = GW - padL - padR;
            const plotH = GH - padT - padB;

            // 背景
            gctx.fillStyle = '#081420';
            gctx.fillRect(0, 0, GW, GH);

            // 坐标轴
            gctx.strokeStyle = '#2a3a4a';
            gctx.lineWidth = 1;
            gctx.beginPath();
            gctx.moveTo(padL, padT);
            gctx.lineTo(padL, padT + plotH);
            gctx.lineTo(padL + plotW, padT + plotH);
            gctx.stroke();

            if (velHist.length < 2) {
                gctx.fillStyle = '#334455';
                gctx.font = '12px system-ui';
                gctx.textAlign = 'center';
                gctx.fillText('开始后将显示 v-t 图', GW / 2, GH / 2);
                return;
            }

            const ph = physics();
            const tMax = Math.max(ph.tTrans + 0.5, 5, ...velHist.map(p => p.t));
            const vMax = Math.max(P.v0A, ph.vFinal, 1) * 1.25;

            const TX = t => padL + (t / tMax) * plotW;
            const VY = v => padT + plotH - (v / vMax) * plotH;

            // 网格
            gctx.strokeStyle = '#12202e';
            gctx.lineWidth = 1;
            const tStep = tMax <= 6 ? 1 : 2;
            for (let t = 0; t <= tMax; t += tStep) {
                const x = TX(t);
                gctx.beginPath(); gctx.moveTo(x, padT); gctx.lineTo(x, padT + plotH); gctx.stroke();
                gctx.fillStyle = '#556677';
                gctx.font = '10px system-ui';
                gctx.textAlign = 'center';
                gctx.fillText(t.toFixed(0) + 's', x, padT + plotH + 14);
            }
            const vStep = vMax <= 15 ? 5 : 10;
            for (let v = 0; v <= vMax; v += vStep) {
                const y = VY(v);
                gctx.beginPath(); gctx.moveTo(padL, y); gctx.lineTo(padL + plotW, y); gctx.stroke();
                gctx.fillStyle = '#556677';
                gctx.font = '10px system-ui';
                gctx.textAlign = 'right';
                gctx.fillText(v.toFixed(0), padL - 5, y + 3);
            }

            // 共速竖线
            if (ph.tTrans > 0 && ph.tTrans <= tMax) {
                gctx.strokeStyle = 'rgba(255,255,255,0.15)';
                gctx.setLineDash([4, 4]);
                gctx.beginPath();
                gctx.moveTo(TX(ph.tTrans), padT);
                gctx.lineTo(TX(ph.tTrans), padT + plotH);
                gctx.stroke();
                gctx.setLineDash([]);
                gctx.fillStyle = '#8899aa';
                gctx.font = '10px system-ui';
                gctx.textAlign = 'center';
                gctx.fillText('共速', TX(ph.tTrans), padT + 10);
            }

            // 曲线 A
            if (velHist.length >= 2) {
                gctx.strokeStyle = '#3399ff';
                gctx.lineWidth = 2;
                gctx.beginPath();
                gctx.moveTo(TX(velHist[0].t), VY(velHist[0].vA));
                for (let i = 1; i < velHist.length; i++) {
                    gctx.lineTo(TX(velHist[i].t), VY(velHist[i].vA));
                }
                gctx.stroke();
            }

            // 曲线 B
            if (velHist.length >= 2) {
                gctx.strokeStyle = '#ff9933';
                gctx.lineWidth = 2;
                gctx.beginPath();
                gctx.moveTo(TX(velHist[0].t), VY(velHist[0].vB));
                for (let i = 1; i < velHist.length; i++) {
                    gctx.lineTo(TX(velHist[i].t), VY(velHist[i].vB));
                }
                gctx.stroke();
            }

            // 轴标签
            gctx.fillStyle = '#556677';
            gctx.font = '11px system-ui';
            gctx.textAlign = 'center';
            gctx.fillText('t (s)', padL + plotW / 2, GH - 2);
            gctx.save();
            gctx.translate(9, padT + plotH / 2);
            gctx.rotate(-Math.PI / 2);
            gctx.fillText('v (m/s)', 0, 0);
            gctx.restore();

            // 图例
            gctx.fillStyle = '#3399ff';
            gctx.fillRect(padL + 6, padT + 4, 14, 3);
            gctx.fillStyle = '#8899aa';
            gctx.font = '10px system-ui';
            gctx.textAlign = 'left';
            gctx.fillText('vₐ', padL + 24, padT + 10);
            gctx.fillStyle = '#ff9933';
            gctx.fillRect(padL + 52, padT + 4, 14, 3);
            gctx.fillStyle = '#8899aa';
            gctx.fillText('vᵦ', padL + 70, padT + 10);
        }

        // ========== 动画帧 ==========
        function frame(ts) {
            if (state !== 'running') return;
            if (lastTs === null) lastTs = ts;
            const rawDt = (ts - lastTs) / 1000;
            lastTs = ts;
            const dt = Math.min(rawDt, 0.05) * timeScale;
            simT += dt;

            const ph = physics();
            const vel = velocities(simT);

            // A 是否滑出 B
            const relDispAtT = 0 <= ph.tTrans
                ? (simT < ph.tTrans
                    ? 0.5 * (P.v0A - P.v0B) * simT
                    : ph.relDisp)
                : 0;
            const onPlate = ph.slideOff ? relDispAtT < P.L : true;
            const fallen   = ph.slideOff && !onPlate && !slideOffTriggered;

            if (fallen) {
                slideOffTriggered = true;
                elStatus.textContent = '⚠ 物块 A 已滑出板块 B，继续运动...';
            }

            // 结束条件：共速后稳定 3 秒 或 超过 15 秒
            const bothMoving = vel.trans || (ph.tTrans > 0 && simT > ph.tTrans);
            if (bothMoving && simT - ph.tTrans > 3) {
                endSim();
                return;
            }
            if (simT > 15) {
                endSim();
                return;
            }

            // B 位置
            const bX = ph.tTrans > 0
                ? (simT < ph.tTrans
                    ? P.v0B * simT + 0.5 * (P.mu * g * P.mA / P.mB) * simT * simT
                    : P.v0B * ph.tTrans + 0.5 * (P.mu * g * P.mA / P.mB) * ph.tTrans * ph.tTrans + ph.vFinal * (simT - ph.tTrans))
                : P.v0B * simT;

            // A 位置
            const aX = onPlate
                ? bX + relDispAtT
                : bX + (ph.slideOff ? ph.relDisp : relDispAtT);

            const drawB = { x: bX, v: vel.vB };
            const drawA = {
                x: aX, v: vel.vA,
                onPlate: onPlate && !fallen,
                fallen: fallen,
            };

            drawScene(simT, drawA, drawB);

            // 速度历史
            velHist.push({ t: simT, vA: vel.vA, vB: vel.vB });

            // 更新数字
            elVA.textContent  = vel.vA.toFixed(2) + ' m/s';
            elVB.textContent  = vel.vB.toFixed(2) + ' m/s';
            elVR.textContent  = Math.abs(vel.vA - vel.vB).toFixed(2) + ' m/s';
            if (ph.tTrans <= 0) {
                elState.textContent = '无相对滑动';
                elState.style.color = '#33dd66';
            } else if (vel.trans) {
                elState.textContent = '共速一起运动';
                elState.style.color = '#ffaa22';
            } else {
                elState.textContent = 'A 在 B 上滑动';
                elState.style.color = '#3399ff';
            }

            drawGraph();
            animId = requestAnimationFrame(frame);
        }

        function endSim() {
            state = 'ended';
            if (animId) { cancelAnimationFrame(animId); animId = null; }

            const ph = physics();
            const bXFinal = P.v0B * ph.tTrans + 0.5 * (P.mu * g * P.mA / P.mB) * ph.tTrans * ph.tTrans + ph.vFinal * Math.max(0, simT - ph.tTrans);
            const aXFinal = bXFinal + (ph.slideOff ? ph.relDisp : 0);

            drawScene(simT,
                { x: aXFinal, v: ph.vFinal, onPlate: !ph.slideOff, fallen: ph.slideOff },
                { x: bXFinal, v: ph.vFinal }
            );
            drawGraph();

            elState.textContent = '结束';
            elState.style.color = '#aab';
            btnStart.disabled = true;
            btnReset.disabled = false;
            elStatus.textContent = ph.slideOff
                ? '物块 A 已滑出板块，两者以不同速度运动。'
                : '物块 A 与板块 B 达到共同速度，一起匀速运动。';
        }

        // ========== 控制 ==========
        function start() {
            if (state === 'running') return;
            reset(true);

            const ph = physics();
            state = 'idle';
            simT = 0;
            lastTs = null;
            velHist = [{ t: 0, vA: P.v0A, vB: P.v0B }];
            slideOffTriggered = false;
            elStatus.textContent = '';

            // 信息面板
            elTEnd.textContent = ph.tTrans > 0 ? ph.tTrans.toFixed(2) + ' s' : '—';
            elVFin.textContent = ph.vFinal.toFixed(2) + ' m/s';
            elRel.textContent  = ph.relDisp.toFixed(2) + ' m';
            elSlide.textContent = ph.slideOff ? '✓ 滑出' : '✗ 未滑出';
            elSlide.style.color = ph.slideOff ? '#ff6644' : '#33dd66';
            elHeat.textContent = ph.heat.toFixed(2) + ' J';

            state = 'running';
            btnStart.disabled = true;
            btnReset.disabled = false;
            elV0B.disabled = true;
            elMu.disabled = true;
            elTs.disabled = true;

            drawScene(0,
                { x: 0, v: P.v0A, onPlate: true, fallen: false },
                { x: 0, v: P.v0B }
            );
            drawGraph();

            animId = requestAnimationFrame(frame);
        }

        function reset(silent) {
            if (animId) { cancelAnimationFrame(animId); animId = null; }
            state = 'idle';
            simT = 0;
            lastTs = null;
            velHist = [];
            slideOffTriggered = false;

            P.v0A = 12;
            P.v0B = parseFloat(elV0B.value) || 0;
            P.mu  = parseFloat(elMu.value) / 100;
            timeScale = parseFloat(elTs.value) / 10;

            elVA.textContent = elVB.textContent = elVR.textContent = '—';
            elVA.textContent = P.v0A.toFixed(2) + ' m/s';
            elVB.textContent = P.v0B.toFixed(2) + ' m/s';
            elState.textContent = '待开始';
            elState.style.color = '#99aabb';
            elStatus.textContent = '';
            elV0B.disabled = false;
            elMu.disabled = false;
            elTs.disabled = false;

            const ph = physics();
            elTEnd.textContent = ph.tTrans > 0 ? ph.tTrans.toFixed(2) + ' s' : '—';
            elVFin.textContent = ph.vFinal.toFixed(2) + ' m/s';
            elRel.textContent  = ph.relDisp.toFixed(2) + ' m';
            elSlide.textContent = ph.slideOff ? '✓ 滑出' : '✗ 未滑出';
            elSlide.style.color = ph.slideOff ? '#ff6644' : '#33dd66';
            elHeat.textContent = ph.heat.toFixed(2) + ' J';

            btnStart.disabled = false;
            btnReset.disabled = true;

            drawScene(0,
                { x: 0, v: P.v0A, onPlate: true, fallen: false },
                { x: 0, v: P.v0B }
            );
            drawGraph();
        }

        // ========== 事件绑定 ==========
        elV0B.addEventListener('input', () => {
            elV0BVal.textContent = parseFloat(elV0B.value).toFixed(1) + ' m/s';
            if (state === 'idle') {
                P.v0B = parseFloat(elV0B.value);
                elVB.textContent = P.v0B.toFixed(2) + ' m/s';
                const ph = physics();
                elTEnd.textContent = ph.tTrans > 0 ? ph.tTrans.toFixed(2) + ' s' : '—';
                elVFin.textContent = ph.vFinal.toFixed(2) + ' m/s';
                elRel.textContent  = ph.relDisp.toFixed(2) + ' m';
                elSlide.textContent = ph.slideOff ? '✓ 滑出' : '✗ 未滑出';
                elSlide.style.color = ph.slideOff ? '#ff6644' : '#33dd66';
                elHeat.textContent = ph.heat.toFixed(2) + ' J';
                drawScene(0, { x: 0, v: P.v0A, onPlate: true, fallen: false }, { x: 0, v: P.v0B });
            }
        });

        elMu.addEventListener('input', () => {
            P.mu = parseFloat(elMu.value) / 100;
            elMuVal.textContent = P.mu.toFixed(2);
            if (state === 'idle') {
                const ph = physics();
                elTEnd.textContent = ph.tTrans > 0 ? ph.tTrans.toFixed(2) + ' s' : '—';
                elVFin.textContent = ph.vFinal.toFixed(2) + ' m/s';
                elRel.textContent  = ph.relDisp.toFixed(2) + ' m';
                elSlide.textContent = ph.slideOff ? '✓ 滑出' : '✗ 未滑出';
                elSlide.style.color = ph.slideOff ? '#ff6644' : '#33dd66';
                elHeat.textContent = ph.heat.toFixed(2) + ' J';
            }
        });

        elTs.addEventListener('input', () => {
            timeScale = parseFloat(elTs.value) / 10;
            elTsVal.textContent = timeScale.toFixed(1) + '×';
        });

        btnStart.addEventListener('click', start);
        btnReset.addEventListener('click', () => reset(false));

        // ========== 启动 ==========
        reset(true);
    })();
    </script>
</body>
</html>
