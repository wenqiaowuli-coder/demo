<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平抛运动演示｜高中物理</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        canvas {
            border: 2px solid #3388dd;
            background-color: #0b1828;
        }
        .control-panel {
            margin-top: 14px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 880px;
        }
        .param-group {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            min-width: 180px;
            flex: 1;
        }
        .param-group .pg-title {
            font-size: 12px;
            color: #8899aa;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .param-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .param-row label {
            font-size: 13px;
            color: #ccd;
            white-space: nowrap;
            min-width: 72px;
        }
        .param-row .val {
            font-size: 13px;
            color: #5cb8ff;
            font-weight: 600;
            min-width: 58px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .param-row input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.12);
            outline: none;
        }
        .param-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #5cb8ff;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(92, 184, 255, 0.4);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            padding-bottom: 2px;
        }
        button {
            padding: 8px 20px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            background: #2574d9;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #1a5cb0; }
        button:active { background: #154a96; }
        button.reset-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        button.reset-btn:hover { background: rgba(255, 255, 255, 0.14); }
        .info-text {
            margin-top: 12px;
            font-size: 13px;
            color: #999;
            text-align: center;
            line-height: 1.6;
        }
        .formula-hint {
            margin-top: 8px;
            font-size: 12px;
            color: #667;
            text-align: center;
        }
        .formula-hint span { color: #5cb8ff; }
    </style>
</head>
<body>
    <h1>平抛运动演示（轨迹+分速度）</h1>
    <canvas id="canvas" width="850" height="480"></canvas>

    <div class="control-panel">
        <!-- 运动参数 -->
        <div class="param-group">
            <div class="pg-title">运动参数</div>
            <div class="param-row">
                <label>初速度 v₀</label>
                <input type="range" id="v0Slider" min="5" max="50" step="1" value="30">
                <span class="val" id="v0Val">30 m/s</span>
            </div>
            <div class="param-row">
                <label>重力加速度 g</label>
                <input type="range" id="gSlider" min="1" max="20" step="0.5" value="10">
                <span class="val" id="gVal">10 m/s²</span>
            </div>
            <div class="param-row">
                <label>抛出高度 H</label>
                <input type="range" id="hSlider" min="0" max="15" step="0.5" value="5">
                <span class="val" id="hVal">5 m</span>
            </div>
        </div>

        <!-- 动画设置 -->
        <div class="param-group">
            <div class="pg-title">动画设置</div>
            <div class="param-row">
                <label>动画速度</label>
                <input type="range" id="speedSlider" min="0.2" max="3" step="0.1" value="1">
                <span class="val" id="speedVal">1.0x</span>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="btn-group">
            <button id="startBtn">开始平抛</button>
            <button id="resetBtn" class="reset-btn">重置</button>
        </div>
    </div>

    <div class="info-text" id="infoText"></div>
    <div class="formula-hint">
        水平：<span>x = v₀t</span> &nbsp; 竖直：<span>y = ½gt²</span> &nbsp;
        vₓ = <span>v₀</span>（匀速） &nbsp; vᵧ = <span>gt</span>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ===== 唯一参数源：所有可调参数集中在这里 =====
        const params = {
            v0: 30,            // 水平初速度 m/s
            g: 10,             // 重力加速度 m/s²
            H: 5,              // 抛出高度 m
            animSpeed: 1.0,    // 动画倍速
        };

        // 常量（不可通过滑块调节）
        const SCALE = 2.2;    // 像素/米
        const ORIGIN_X = 80;  // 坐标原点 X
        const ORIGIN_Y = 80;  // 坐标原点 Y
        const GROUND_Y = canvas.height - 30;

        let t = 0;
        let running = false;
        let animId = null;
        let tracePoints = [];

        // ===== 从 HTML 滑块读取默认值初始化（不用写死） =====
        function syncParamsFromDOM() {
            params.v0        = parseFloat(document.getElementById('v0Slider').value);
            params.g         = parseFloat(document.getElementById('gSlider').value);
            params.H         = parseFloat(document.getElementById('hSlider').value);
            params.animSpeed = parseFloat(document.getElementById('speedSlider').value);
        }

        // ===== 滑块绑定（改 params 对象，不用 window.xxx） =====
        const sliderConfig = [
            { id: 'v0Slider',    key: 'v0',        unit: 'm/s',  decimals: 0 },
            { id: 'gSlider',     key: 'g',         unit: 'm/s²', decimals: 1 },
            { id: 'hSlider',     key: 'H',         unit: 'm',    decimals: 1 },
            { id: 'speedSlider', key: 'animSpeed',  unit: 'x',    decimals: 1 },
        ];

        sliderConfig.forEach(({ id, key, unit, decimals }) => {
            const slider = document.getElementById(id);
            const valEl  = document.getElementById(id.replace('Slider', 'Val'));
            slider.addEventListener('input', () => {
                params[key] = parseFloat(slider.value);
                valEl.textContent = params[key].toFixed(decimals) + ' ' + unit;
                refreshInfoText();
                if (!running) draw();
            });
        });

        // ===== 底部信息文字 =====
        function refreshInfoText() {
            document.getElementById('infoText').textContent =
                `v₀ = ${params.v0.toFixed(0)} m/s  |  g = ${params.g.toFixed(1)} m/s²  |  H = ${params.H.toFixed(1)} m` +
                `    蓝色=vₓ  绿色=vᵧ  橙色=合速度`;
        }

        // ===== 重置 =====
        function reset() {
            if (animId) cancelAnimationFrame(animId);
            running = false;
            t = 0;
            tracePoints = [];
            draw();
        }

        // ===== 箭头 =====
        function drawArrow(fx, fy, tx, ty, color) {
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(fx, fy);
            ctx.lineTo(tx, ty);
            ctx.stroke();

            const headLen = 10;
            const angle = Math.atan2(ty - fy, tx - fx);
            ctx.beginPath();
            ctx.moveTo(tx, ty);
            ctx.lineTo(tx - headLen * Math.cos(angle - Math.PI / 6), ty - headLen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tx - headLen * Math.cos(angle + Math.PI / 6), ty - headLen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
        }

        // ===== 主绘制 =====
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 抛出点画布坐标
            const launchY = ORIGIN_Y + params.H * SCALE;

            // 当前位置（物理公式）
            const x  = ORIGIN_X + params.v0 * t * SCALE;
            const y  = launchY + 0.5 * params.g * t * t * SCALE;
            const vy = params.g * t;
            const vx = params.v0;

            // 落地终止
            if (y >= GROUND_Y || x >= canvas.width) {
                running = false;
            }

            // 保存轨迹
            if (running) {
                tracePoints.push({ x, y });
            }

            // --- 地面 ---
            ctx.strokeStyle = 'rgba(52, 211, 153, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ORIGIN_X - 10, GROUND_Y);
            ctx.lineTo(canvas.width - 20, GROUND_Y);
            ctx.stroke();
            ctx.fillStyle = 'rgba(52, 211, 153, 0.04)';
            ctx.fillRect(ORIGIN_X - 10, GROUND_Y, canvas.width - ORIGIN_X - 10, 30);

            // --- 坐标轴 ---
            ctx.strokeStyle = '#4477bb';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(ORIGIN_X, ORIGIN_Y);
            ctx.lineTo(canvas.width - 20, ORIGIN_Y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(ORIGIN_X, ORIGIN_Y);
            ctx.lineTo(ORIGIN_X, GROUND_Y);
            ctx.stroke();

            // --- 发射台 ---
            const platW = 24;
            ctx.fillStyle = 'rgba(92, 184, 255, 0.2)';
            ctx.fillRect(ORIGIN_X - platW / 2, launchY - 4, platW, 4);
            ctx.strokeStyle = 'rgba(92, 184, 255, 0.5)';
            ctx.lineWidth = 1;
            ctx.strokeRect(ORIGIN_X - platW / 2, launchY - 4, platW, 4);

            // H 高度标注
            if (params.H > 0.5) {
                ctx.strokeStyle = 'rgba(251, 191, 36, 0.35)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 3]);
                ctx.beginPath();
                ctx.moveTo(ORIGIN_X - platW / 2 - 12, GROUND_Y);
                ctx.lineTo(ORIGIN_X - platW / 2 - 12, launchY);
                ctx.stroke();
                ctx.setLineDash([]);

                const midY = (GROUND_Y + launchY) / 2;
                ctx.fillStyle = 'rgba(251, 191, 36, 0.7)';
                ctx.beginPath();
                ctx.moveTo(ORIGIN_X - platW / 2 - 16, midY);
                ctx.lineTo(ORIGIN_X - platW / 2 - 12, midY + 5);
                ctx.lineTo(ORIGIN_X - platW / 2 - 8, midY);
                ctx.fill();

                ctx.fillStyle = '#fbbf24';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('H=' + params.H.toFixed(1) + 'm', ORIGIN_X - platW / 2 - 10, launchY - 6);
            }

            // --- 轨迹线（发光 + 实线） ---
            if (tracePoints.length > 1) {
                ctx.strokeStyle = 'rgba(255, 100, 100, 0.2)';
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(tracePoints[0].x, tracePoints[0].y);
                for (const p of tracePoints) ctx.lineTo(p.x, p.y);
                ctx.stroke();

                ctx.strokeStyle = '#ff8888';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(tracePoints[0].x, tracePoints[0].y);
                for (const p of tracePoints) ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }

            // --- 小球（径向渐变） ---
            ctx.beginPath();
            const grad = ctx.createRadialGradient(x - 2, y - 2, 1, x, y, 11);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.4, '#ff5555');
            grad.addColorStop(1, '#cc0000');
            ctx.fillStyle = grad;
            ctx.arc(x, y, 11, 0, Math.PI * 2);
            ctx.fill();

            // --- 速度箭头 ---
            const velScale = 1.8;
            drawArrow(x, y, x + vx * velScale, y, '#3399ff');
            drawArrow(x, y, x, y + vy * velScale, '#33dd66');
            drawArrow(x, y, x + vx * velScale, y + vy * velScale, '#ffaa22');

            // --- 底部数据 ---
            ctx.fillStyle = '#aaaaaa';
            ctx.font = '14px sans-serif';
            ctx.fillText(`t = ${t.toFixed(2)} s`, 20, canvas.height - 12);
            ctx.fillText(`vₓ = ${vx.toFixed(1)} m/s`, 160, canvas.height - 12);
            ctx.fillText(`vᵧ = ${vy.toFixed(1)} m/s`, 380, canvas.height - 12);
            ctx.fillText(`v = ${Math.hypot(vx, vy).toFixed(1)} m/s`, 600, canvas.height - 12);

            // 原点标注
            ctx.fillStyle = '#5577aa';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('O', ORIGIN_X - 16, ORIGIN_Y + 14);

            // 动画步进
            if (running) {
                t += 0.025 * params.animSpeed;
                animId = requestAnimationFrame(draw);
            }
        }

        // ===== 按钮事件 =====
        startBtn.onclick = () => { if (!running) { running = true; draw(); } };
        resetBtn.onclick = reset;

        // ===== 启动：从 DOM 读取滑块初始值，统一到 params =====
        syncParamsFromDOM();
        refreshInfoText();
        reset();
    </script>
</body>
</html>
