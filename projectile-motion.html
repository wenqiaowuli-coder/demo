<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平抛运动演示｜高中物理</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        canvas {
            border: 2px solid #3388dd;
            background-color: #0b1828;
        }
        .control-panel {
            margin-top: 14px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 880px;
        }
        .param-group {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            min-width: 180px;
            flex: 1;
        }
        .param-group .pg-title {
            font-size: 12px;
            color: #8899aa;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .param-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .param-row label {
            font-size: 13px;
            color: #ccd;
            white-space: nowrap;
            min-width: 72px;
        }
        .param-row input[type=range] { flex: 1; }
        .param-row .val {
            min-width: 56px;
            text-align: right;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        .actions {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            background: #3388dd;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .legend {
            margin-top: 12px;
            font-size: 12px;
            color: #aab;
            text-align: center;
        }
        .legend span { margin: 0 6px; }
    </style>
</head>
<body>
    <h1>平抛运动演示</h1>
    <canvas id="canvas" width="880" height="520"></canvas>
    <div class="control-panel">
        <div class="param-group">
            <div class="pg-title">参数设定</div>
            <div class="param-row">
                <label>高度 h</label>
                <input id="h" type="range" min="60" max="360" value="220" step="10">
                <div class="val" id="hVal">220 m</div>
            </div>
            <div class="param-row">
                <label>初速度 v₀</label>
                <input id="v0" type="range" min="5" max="25" value="12" step="0.5">
                <div class="val" id="v0Val">12.0 m/s</div>
            </div>
        </div>
        <div class="param-group">
            <div class="pg-title">实时数值（地面为参考）</div>
            <div class="param-row">
                <label>水平 vₓ</label>
                <div class="val" id="vx">0.00 m/s</div>
            </div>
            <div class="param-row">
                <label>竖直 vᵧ</label>
                <div class="val" id="vy">0.00 m/s</div>
            </div>
            <div class="param-row">
                <label>合速度 v</label>
                <div class="val" id="vv">0.00 m/s</div>
            </div>
            <div class="param-row">
                <label>方向角 θ</label>
                <div class="val" id="vt">0.0°</div>
            </div>
        </div>
    </div>
    <div class="actions">
        <button id="btnStart">开始</button>
        <button id="btnPause" disabled>暂停</button>
        <button id="btnContinue" disabled>继续</button>
        <button id="btnReset">重置</button>
    </div>
    <div class="legend">
        <span>🟢 vₓ</span>
        <span>🟠 vᵧ</span>
        <span>🔵 v</span>
        <span>轨迹：蓝色</span>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const inputH = document.getElementById('h');
        const inputV0 = document.getElementById('v0');
        const hVal = document.getElementById('hVal');
        const v0Val = document.getElementById('v0Val');
        const elVx = document.getElementById('vx');
        const elVy = document.getElementById('vy');
        const elVv = document.getElementById('vv');
        const elVt = document.getElementById('vt');
        const btnStart = document.getElementById('btnStart');
        const btnPause = document.getElementById('btnPause');
        const btnContinue = document.getElementById('btnContinue');
        const btnReset = document.getElementById('btnReset');
        const g = 9.8;
        let state = 'idle';
        let t = 0;
        let lastTs = null;
        let path = [];
        let raf = null;
        const SCALE = 6;
        const PAD = 50;
        const originX = () => PAD;
        const originY = () => canvas.height - PAD;
        function hMeters() { return Number(inputH.value); }
        function v0Meters() { return Number(inputV0.value); }
        function xOf(t) { return v0Meters() * t; }
        function yOf(t) { return hMeters() - 0.5 * g * t * t; }
        function tEnd() { return Math.sqrt(2 * hMeters() / g); }
        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1f2d3d';
            ctx.lineWidth = 1;
            const ox = originX();
            const oy = originY();
            ctx.beginPath();
            for (let x = ox; x <= canvas.width - PAD; x += SCALE * 10) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            for (let y = oy; y >= PAD; y -= SCALE * 10) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
            ctx.strokeStyle = '#3a4a5a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ox, oy);
            ctx.lineTo(canvas.width - PAD, oy);
            ctx.stroke();
        }
        function drawPath() {
            if (!path.length) return;
            ctx.strokeStyle = '#3388dd';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(path[0].x, path[0].y);
            for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
            ctx.stroke();
        }
        function drawPoint(x, y) {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        function drawArrow(fromX, fromY, toX, toY, color) {
            const headLen = 10;
            const dx = toX - fromX;
            const dy = toY - fromY;
            const len = Math.hypot(dx, dy);
            if (len === 0) return;
            const ux = dx / len;
            const uy = dy / len;
            const endX = toX;
            const endY = toY;
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(endX, endY);
            ctx.stroke();
            const angle = Math.atan2(dy, dx);
            ctx.beginPath();
            ctx.moveTo(endX, endY);
            ctx.lineTo(endX - headLen * Math.cos(angle - Math.PI / 6), endY - headLen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(endX - headLen * Math.cos(angle + Math.PI / 6), endY - headLen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
        }
        function updateLabels(vx, vy, vv, thetaDeg) {
            elVx.textContent = vx.toFixed(2) + ' m/s';
            elVy.textContent = vy.toFixed(2) + ' m/s';
            elVv.textContent = vv.toFixed(2) + ' m/s';
            elVt.textContent = thetaDeg.toFixed(1) + '°';
        }
        function frame(ts) {
            if (state !== 'running') return;
            if (lastTs === null) lastTs = ts;
            const dt = Math.min((ts - lastTs) / 1000, 0.05);
            lastTs = ts;
            t += dt;
            if (t >= tEnd()) {
                t = tEnd();
                state = 'ended';
                btnStart.disabled = true;
                btnPause.disabled = true;
                btnContinue.disabled = true;
            }
            const x = xOf(t);
            const y = yOf(t);
            const sx = originX() + SCALE * x;
            const sy = originY() - SCALE * Math.max(y, 0);
            path.push({x: sx, y: sy});
            const vx = v0Meters();
            const vy = -g * t;
            const vv = Math.hypot(vx, vy);
            const thetaDeg = Math.atan2(-vy, vx) * 180 / Math.PI;
            drawGrid();
            drawPath();
            drawPoint(sx, sy);
            const arrowScale = 3.5;
            drawArrow(sx, sy, sx + arrowScale * vx, sy, '#33cc55');
            drawArrow(sx, sy, sx, sy + arrowScale * (-vy), '#ff9933');
            drawArrow(sx, sy, sx + arrowScale * vx, sy + arrowScale * (-vy), '#3388dd');
            updateLabels(vx, -vy, vv, thetaDeg);
            if (state === 'ended') return;
            raf = requestAnimationFrame(frame);
        }
        function start() {
            if (state === 'running') return;
            path = [];
            t = 0;
            lastTs = null;
            state = 'running';
            btnStart.disabled = true;
            btnPause.disabled = false;
            btnContinue.disabled = true;
            inputH.disabled = true;
            inputV0.disabled = true;
            raf = requestAnimationFrame(frame);
        }
        function pause() {
            if (state !== 'running') return;
            state = 'paused';
            if (raf) cancelAnimationFrame(raf);
            btnPause.disabled = true;
            btnContinue.disabled = false;
        }
        function resume() {
            if (state !== 'paused') return;
            state = 'running';
            lastTs = null;
            btnPause.disabled = false;
            btnContinue.disabled = true;
            raf = requestAnimationFrame(frame);
        }
        function reset() {
            if (raf) cancelAnimationFrame(raf);
            state = 'idle';
            t = 0;
            lastTs = null;
            path = [];
            inputH.disabled = false;
            inputV0.disabled = false;
            btnStart.disabled = false;
            btnPause.disabled = true;
            btnContinue.disabled = true;
            updateLabels(0, 0, 0, 0);
            drawGrid();
        }
        btnStart.addEventListener('click', start);
        btnPause.addEventListener('click', pause);
        btnContinue.addEventListener('click', resume);
        btnReset.addEventListener('click', reset);
        inputH.addEventListener('input', () => { hVal.textContent = inputH.value + ' m'; if (state === 'idle') reset(); });
        inputV0.addEventListener('input', () => { v0Val.textContent = Number(inputV0.value).toFixed(1) + ' m/s'; if (state === 'idle') reset(); });
        hVal.textContent = inputH.value + ' m';
        v0Val.textContent = Number(inputV0.value).toFixed(1) + ' m/s';
        reset();
    </script>
</body>
</html>
